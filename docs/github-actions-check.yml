name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: shell/go.sum
      - run: npm ci
      - run: npm -w core run typecheck
      - run: npm test
      - run: npm run build
      - name: Build Linux development shell
        working-directory: shell
        run: ./build.sh dev
      - name: Test desktop shell
        working-directory: shell
        run: go test ./...
      - name: Check Windows build
        working-directory: shell
        run: go vet ./...
        env:
          GOOS: windows
          GOARCH: amd64
